<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Freshbite Backend | Customer Orders</title>
  <style>
    :root{font-family:Arial,Helvetica,sans-serif;color:#20251f;background:#f7f8f3;font-synthesis:none}*{box-sizing:border-box}body{margin:0}.top{background:#fff;border-bottom:1px solid #e5e7df;padding:17px max(calc((100vw - 1120px)/2),5%);display:flex;align-items:center;justify-content:space-between}.brand{font-size:21px;font-weight:800;color:#1f6a43}.badge{font-size:12px;font-weight:700;color:#1f6a43;background:#edf4e4;border-radius:20px;padding:8px 12px}.page{max-width:1120px;margin:44px auto 80px;padding:0 22px}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:800;color:#1f6a43;margin:0 0 12px}.heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px}h1{font-size:clamp(34px,5vw,48px);letter-spacing:-2px;margin:0}.sub{font-size:13px;line-height:1.6;color:#777d75;margin:10px 0 0}.actions{display:flex;align-items:center;gap:9px}.refresh,.front-link{border:0;border-radius:9px;padding:12px 16px;background:#1f6a43;color:#fff;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}.refresh:hover,.front-link:hover{background:#174d31}.refresh:disabled{opacity:.65;cursor:wait}.refresh-form{margin:0}.status{min-height:20px;color:#777d75;font-size:12px;margin:0 0 14px}.orders{display:grid;gap:16px}.order{background:#fff;border:1px solid #e5e7df;border-radius:15px;padding:21px}.order-head{display:flex;justify-content:space-between;gap:15px;align-items:start;border-bottom:1px solid #e9e8e0;padding-bottom:15px}.order-id{font-size:13px;font-weight:700;overflow-wrap:anywhere}.order-date{font-size:12px;color:#777d75;margin-top:5px}.state{border-radius:20px;padding:7px 11px;background:#edf4e4;color:#1f6a43;font-size:11px;font-weight:800;white-space:nowrap}.columns{display:grid;grid-template-columns:1fr 1.3fr;gap:24px;padding:18px 0}.section h2{font-size:14px;margin:0 0 10px}.customer{font-size:13px;line-height:1.8;color:#555d54;overflow-wrap:anywhere}.customer strong{color:#20251f}.items{list-style:none;margin:0;padding:0;display:grid;gap:10px}.item{display:grid;grid-template-columns:62px 1fr auto;align-items:center;gap:11px;border:1px solid #e9e8e0;border-radius:10px;padding:9px}.item img,.placeholder{width:62px;height:62px;object-fit:cover;border-radius:8px;background:#eceee7}.item-name{font-size:13px;font-weight:700}.item-meta,.item-desc{font-size:11px;line-height:1.5;color:#777d75;margin-top:3px}.item-price{font-size:12px;font-weight:800;color:#1f6a43;white-space:nowrap}.total{display:flex;justify-content:space-between;border-top:1px solid #e9e8e0;padding-top:14px;font-size:14px}.total b{font-size:18px;color:#1f6a43}.note{margin-top:14px;background:#f7f8f3;padding:12px;border-radius:9px;font-size:12px;color:#555d54;white-space:pre-wrap;overflow-wrap:anywhere}.empty{background:#fff;border:1px dashed #e5e7df;border-radius:15px;padding:45px;text-align:center;color:#777d75}.error{color:#a33226}@media(max-width:680px){.page{margin-top:30px;padding:0 14px}.heading{align-items:start;flex-direction:column}.actions{width:100%}.actions>*{flex:1;text-align:center}.order{padding:15px}.columns{grid-template-columns:1fr;gap:18px}}
  </style>
  <style>
    :root{color:#f2f5f2;background:#090a09;font-family:Arial,Helvetica,sans-serif}
    body{min-height:100vh;background:radial-gradient(ellipse at 8% 0%,rgba(131,139,133,.18),transparent 26%),#090a09;color:#f2f5f2}
    .top{position:sticky;top:0;z-index:5;background:rgba(12,13,12,.96);border-bottom:1px solid #292c2a;backdrop-filter:blur(14px)}
    .brand{display:flex;align-items:center;gap:9px;color:#f5f7f5;font-size:21px}.brand-mark{display:grid;place-items:center;width:31px;height:31px;border-radius:10px;background:#39c98a;color:#07140d;font-size:22px}.brand-dot{color:#f04452;margin-left:-8px}.badge{background:#1d392b;color:#54d99d;border:1px solid #315a43;letter-spacing:1px}
    .page{position:relative;max-width:1180px;margin:45px auto 80px;padding:36px 32px 42px;border:1px solid #303431;border-radius:25px;background:radial-gradient(ellipse at 100% 0%,rgba(38,101,67,.12),transparent 30%),#111211;box-shadow:0 30px 90px rgba(0,0,0,.35)}
    .eyebrow{color:#53d99b}.heading{align-items:center;border-bottom:1px solid #303431;padding-bottom:23px;margin-bottom:19px}h1{color:#f5f7f5;font-weight:800}.sub{color:#a3aaa5}.actions{gap:10px}
    .refresh,.front-link{display:inline-flex;align-items:center;justify-content:center;min-height:42px;border-radius:10px;transition:transform .18s,box-shadow .18s,background .18s}.refresh{background:#f04452;color:#fff;box-shadow:0 8px 22px rgba(240,68,82,.19)}.refresh:hover{background:#fa5964;box-shadow:0 10px 25px rgba(240,68,82,.28);transform:translateY(-2px)}.front-link{background:#39c98a;color:#07140d;box-shadow:0 8px 22px rgba(57,201,138,.17)}.front-link:hover{background:#55e0a0;color:#07140d;transform:translateY(-2px)}
    .status{color:#9da69f}.orders{gap:14px}.order{background:linear-gradient(145deg,#202321,#181a19);border:1px solid #373b38;border-radius:17px;color:#f2f5f2;box-shadow:0 10px 30px rgba(0,0,0,.17);animation:backendOrderIn .42s both;transition:transform .2s,border-color .2s,box-shadow .2s}.order:nth-child(2){animation-delay:.06s}.order:nth-child(3){animation-delay:.12s}.order:nth-child(4){animation-delay:.18s}.order:hover{transform:translateY(-3px);border-color:#437356;box-shadow:0 16px 35px rgba(25,180,108,.09)}
    .order-head{border-color:#3a3e3b}.order-id{color:#f4f6f4}.order-date{color:#a3aaa5}.state{background:#20392c;color:#5de0a2;border:1px solid #315b43}.columns{gap:30px}.section h2{color:#f0f4f0}.customer{color:#c1c7c2}.items{gap:8px}.item{background:#191c1a;border-color:#363a37;color:#e8ece8;transition:border-color .2s,background .2s}.item:hover{background:#202522;border-color:#4b7059}.item img,.placeholder{background:#272c28}.item img{transition:transform .25s}.item:hover img{transform:scale(1.04)}.item-name{color:#f4f7f4}.item-meta,.item-desc{color:#a5ada7}.item-price,.total b{color:#56d99d}.total{border-color:#3a3e3b;color:#e9eee9}.note{background:#202321;color:#c0c7c1;border:1px solid #353a36}.empty{background:#191c1a;border-color:#414741;color:#aab2ac}.error{color:#ff7b83}
    @keyframes backendOrderIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:680px){.page{margin:20px 12px 45px;padding:23px 15px;border-radius:18px}.heading{gap:14px}.actions{gap:8px}.actions>*{flex:1;text-align:center}.order{padding:15px}.columns{grid-template-columns:1fr;gap:18px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <header class="top"><a class="brand" href="/shop"><span class="brand-mark">f</span>Freshbite<span class="brand-dot">.</span></a><span class="badge">ADMIN DASHBOARD</span></header>
  <main class="page">
    <div class="heading"><div><p class="eyebrow">CUSTOMER ORDERS</p><h1>Orders dashboard</h1><p class="sub">Customer contact details and the complete product snapshot saved with each order. Updates every 10 seconds.</p></div><div class="actions"><a class="front-link" href="/shop">Open front page</a><form class="refresh-form" action="/admin" method="get"><button id="refresh" class="refresh" type="submit">Refresh orders</button></form></div></div>
    <p id="status" class="status" role="status">Loading orders…</p>
    <section id="orders" class="orders" aria-live="polite"></section>
  </main>
  <script src="/admin.js"></script>
</body>
</html>
