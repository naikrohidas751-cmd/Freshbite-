<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Local Freshbite customer orders dashboard." />
  <title>Freshbite | Customer orders</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .orders-page{max-width:1160px;margin:54px auto 90px;padding:0 24px}
    .orders-heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:25px}
    .orders-heading h1{font:800 clamp(34px,5vw,48px)/1.1 Manrope,sans-serif;letter-spacing:-2px;margin:0}
    .orders-heading h1 span{color:var(--green)}
    .orders-note{color:var(--muted);font-size:13px;line-height:1.6;margin:9px 0 0}
    .orders-tools{display:flex;gap:10px;align-items:center}
    .orders-tools button,.orders-tools a{border:1px solid var(--line);background:white;color:var(--ink);border-radius:9px;padding:11px 15px;font-weight:700;font-size:13px}
    .orders-tools button:hover,.orders-tools a:hover{border-color:var(--green);color:var(--green)}
    .orders-status{min-height:20px;color:var(--muted);font-size:12px;margin:0 0 14px}
    .orders-list{display:grid;gap:16px}
    .order-card{background:white;border:1px solid var(--line);border-radius:15px;padding:22px}
    .order-top{display:flex;justify-content:space-between;gap:15px;align-items:start;border-bottom:1px solid var(--line);padding-bottom:15px}
    .order-id{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.order-id b{color:var(--ink)}
    .order-date{font-size:12px;color:var(--muted);margin-top:5px}
    .order-status{border-radius:20px;padding:7px 11px;background:#edf4e4;color:var(--green);font-size:11px;font-weight:800;white-space:nowrap}
    .order-columns{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:18px 0}
    .order-section h2{font:700 14px Manrope,sans-serif;margin:0 0 10px}
    .customer-detail{font-size:13px;line-height:1.7;color:#555d54;overflow-wrap:anywhere}
    .customer-detail b{color:var(--ink)}
    .order-items{list-style:none;margin:0;padding:0;display:grid;gap:12px}
    .order-items li{display:grid;grid-template-columns:58px 1fr auto;align-items:center;gap:11px;border:1px solid var(--line);border-radius:10px;padding:9px}
    .ordered-product-image{width:58px;height:58px;object-fit:cover;border-radius:8px;background:#eceee7}
    .ordered-product-name{font-size:13px;color:var(--ink);font-weight:700}
    .ordered-product-meta,.ordered-product-description{font-size:11px;color:var(--muted);line-height:1.5;margin-top:3px}
    .ordered-product-price{font-size:12px;color:var(--green);font-weight:800;white-space:nowrap;text-align:right}
    .order-total{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px;font-size:14px}
    .order-total b{font-size:18px;color:var(--green)}
    .order-notes{margin-top:15px;background:#f7f8f2;padding:12px;border-radius:9px;font-size:12px;color:#555d54;white-space:pre-wrap;overflow-wrap:anywhere}
    .orders-empty{background:white;border:1px dashed var(--line);border-radius:15px;padding:45px;text-align:center;color:var(--muted)}
    @media(max-width:650px){.orders-page{margin-top:32px;padding:0 16px}.orders-heading{align-items:start;flex-direction:column}.orders-tools{width:100%}.orders-tools>*{flex:1;text-align:center}.order-columns{grid-template-columns:1fr;gap:18px}.order-card{padding:16px}}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark">f</span> freshbite<span class="dot">.</span></a>
    <nav><a href="index.html">Back to menu</a></nav>
    <span class="cart-pill" aria-label="Order count">Orders <span id="order-count">0</span></span>
  </header>
  <main class="orders-page">
    <div class="orders-heading">
      <div><p class="eyebrow">FRESHBITE ADMIN</p><h1>Customer <span>orders.</span></h1><p class="orders-note">Customer details and the full product information captured when each order was placed. This list refreshes every 10 seconds.</p></div>
      <div class="orders-tools"><button id="refresh-orders" type="button">Refresh orders</button><a href="index.html">Open menu</a></div>
    </div>
    <p id="orders-status" class="orders-status" role="status">Loading orders…</p>
    <section id="orders-list" class="orders-list" aria-live="polite"></section>
  </main>
  <script src="orders.js"></script>
</body>
</html>
