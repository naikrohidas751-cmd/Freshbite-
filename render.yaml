services:
  - type: web
    name: freshbite-naikrohidas
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: ADMIN_USERNAME
        value: freshbite-admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATA_DIR
        value: /var/data
    disk:
      name: freshbite-orders
      mountPath: /var/data
      sizeGB: 1